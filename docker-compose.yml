services:
  db:
    image: postgres:17
    container_name: management-software-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: property_manager
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d property_manager"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
